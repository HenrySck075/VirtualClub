name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python (required for pybind11 integration)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Qt 6.11.1 Manually
        run: python .github/scripts/install_qt.py

      # Install pybind11 on Windows via pip
      - name: Install pybind11 (Windows)
        if: matrix.platform == 'windows'
        run: pip install "pybind11[global]"

      # Extract version from CMakeLists.txt (runs on Linux build)
      - name: Extract Version
        id: version
        if: matrix.platform == 'linux'
        run: |
          VERSION=$(grep -E 'project\(.*VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Install Linux-specific build dependencies
      # whole wall for qt6
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libicu-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            libpulse-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-util-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libx11-xcb-dev \
            libsm-dev \
            libice-dev \
            libegl1-mesa-dev \
            libzstd-dev \
            libz-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-x \
            python3-dev \
            pybind11-dev \
            fuse3 \
            libfuse3-dev

      # Install WinFSP for Windows (required for FUSE support)
      - name: Install WinFSP (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install winfsp -y
          echo "WINFSP_DIR=C:\Program Files (x86)\WinFsp" >> $env:GITHUB_ENV

      # Initialize MSVC and Windows SDK environment variables
      - name: Set up MSVC environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        env:
          CC: ${{ matrix.platform == 'windows' && 'clang-cl' || 'clang' }}
          CXX: ${{ matrix.platform == 'windows' && 'clang-cl' || 'clang++' }}
          LD_LIBRARY_PATH: ${{ matrix.platform == 'linux' && format('{0}/qt6:{1}', github.workspace, env.LD_LIBRARY_PATH) || '' }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Build application
      - name: Build Project
        run: cmake --build build --config Release

      # Package Linux Application into a tarball
      - name: Package Application (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          cp build/VirtualClub dist/
          cp -r assets dist/
          
          # Download linuxdeployqt (or install via AppImage)
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage
          
          # Deploy dependencies into dist directory
          ./linuxdeployqt-continuous-x86_64.AppImage dist/VirtualClub -unsupported-bundle-everything -appimage
          
          tar -czvf app-linux-x64.tar.gz -C dist .

      # Package Windows Application with windeployqt into a zip (with assets folder)
      - name: Package Application (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item build\VirtualClub.exe -Destination dist\
          Copy-Item -Recurse assets dist\
          windeployqt --release dist\VirtualClub.exe
          Compress-Archive -Path dist\* -DestinationPath app-windows-x64.zip

      # Upload artifacts temporarily for the release job
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.platform }}
          path: ${{ matrix.platform == 'windows' && 'app-windows-x64.zip' || 'app-linux-x64.tar.gz' }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
    
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifact-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.app_version }}
          name: Release v${{ needs.build.outputs.app_version }}
          draft: false
          prerelease: false
          files: |
            app-linux-x64.tar.gz
            app-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

