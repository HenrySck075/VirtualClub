name: Build and Release

on:
  workflow_dispatch:
    inputs:
      nightly:
        type: boolean
        default: true
  push:
    branches: [qt-cpp-mes]

env:
  NIGHTLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.nightly) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[release]')) }}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            # TODO: remember to turn this back into windows-latest when they install clang 22
          - os: windows-2022
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python (required for pybind11 integration)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Qt Manually
        run: python .github/scripts/install_qt.py

      # Install pybind11 on Windows via pip
      - name: Install pybind11 (Windows)
        if: matrix.platform == 'windows'
        run: pip install "pybind11[global]"

      # Extract version from CMakeLists.txt (runs on Linux build)
      - name: Extract Version
        id: version
        if: matrix.platform == 'linux'
        run: |
          VERSION=$(grep -E 'project\(.*VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Install Linux-specific build dependencies
      # whole wall for qt6
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libicu-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            libpulse-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-util-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libx11-xcb-dev \
            libsm-dev \
            libice-dev \
            libegl1-mesa-dev \
            libzstd-dev \
            libz-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-x \
            python3-dev \
            pybind11-dev \
            fuse3 \
            libfuse3-dev \
            libarchive-dev \
            gdb

      # Install WinFSP for Windows (required for FUSE support)
      - name: Install WinFSP (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install winfsp -y --no-progress

          $winfspDir = "C:\Program Files (x86)\WinFsp"
          if (-not (Test-Path $winfspDir)) {
            throw "WinFsp installation directory not found at $winfspDir"
          }

          "WINFSP_DIR=$winfspDir" >> $env:GITHUB_ENV
          "$winfspDir\bin" >> $env:GITHUB_PATH

          # Verify driver and launcher service registration
          sc.exe query WinFsp.Launcher
          if ($LASTEXITCODE -ne 0) {
            throw "WinFsp.Launcher service is not registered"
          }

          # Ensure WinFsp.Launcher is running for service-based mount tests
          $svc = Get-Service -Name "WinFsp.Launcher" -ErrorAction Stop
          if ($svc.Status -ne "Running") {
            Start-Service -Name "WinFsp.Launcher"
            $svc.WaitForStatus("Running", "00:00:15")
          }

      - name: Create vcpkg directories (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:/vcpkg/downloads", "C:/vcpkg/installed", "C:/vcpkg/archives"

      - name: Restore cache vcpkg (Windows)
        if: matrix.platform == 'windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # Initialize MSVC and Windows SDK environment variables
      - name: Set up MSVC environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        env:
          CC: ${{ matrix.platform == 'windows' && 'clang-cl' || 'clang' }}
          CXX: ${{ matrix.platform == 'windows' && 'clang-cl' || 'clang++' }}
          LD_LIBRARY_PATH: ${{ matrix.platform == 'linux' && format('{0}/qt6:{1}', github.workspace, env.LD_LIBRARY_PATH) || '' }}
          VCPKG_DEFAULT_BINARY_CACHE: ${{ matrix.platform == 'windows' && 'C:/vcpkg/archives' || '' }}
          VCPKG_BINARY_SOURCES: ${{ matrix.platform == 'windows' && 'clear;files,C:/vcpkg/archives,readwrite' || '' }}
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/vcpkg_triplets
          VCPKG_ROOT: C:/vcpkg
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ${{ matrix.platform == 'windows' && format('-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_OVERLAY_TRIPLETS="{0}" -DVCPKG_TARGET_TRIPLET=x64-windows-release', env.VCPKG_OVERLAY_TRIPLETS) || '' }} ${{ env.NIGHTLY == 'true' && format('-DMVC_VERSION="nightly-{0}" -DMVC_CHANNEL=nightly -DMVC_BUILD_ID="{0}"', github.sha) || '-DMVC_CHANNEL=stable' }} ${{ env.NIGHTLY == 'true' && (matrix.platform == 'linux' && '-DCMAKE_C_FLAGS_RELEASE="-O2 -g -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O2 -g -DNDEBUG -ferror-limit=0 -fdiagnostics-show-option" -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-Wl,--build-id"' || '-DCMAKE_C_FLAGS_RELEASE="/O2 /Zi /DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="/O2 /Zi /DNDEBUG -ferror-limit=0" -DCMAKE_EXE_LINKER_FLAGS_RELEASE="/DEBUG /INCREMENTAL:NO" -DCMAKE_SHARED_LINKER_FLAGS_RELEASE="/DEBUG /INCREMENTAL:NO"') || '' }}

      - name: Save cache vcpkg (Windows)
        if: matrix.platform == 'windows' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            C:/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Install and Deploy Application
        env:
          LD_LIBRARY_PATH: ${{ matrix.platform == 'linux' && format('{0}/qt6/lib:{1}', github.workspace, env.LD_LIBRARY_PATH) || '' }}
        run: cmake --install build --prefix dist

      - name: Run CTest
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ matrix.platform == 'linux' && format('{0}/dist/lib:{0}/qt6/lib:{1}', github.workspace, env.LD_LIBRARY_PATH) || '' }}
          QT_PLUGIN_PATH: ${{ matrix.platform == 'linux' && format('{0}/dist/plugins:{0}/qt6/plugins', github.workspace) || '' }}
          LIBPATH: ${{ matrix.platform == 'windows' && format('{0}/dist;{0}/dist/bin;{1}', github.workspace, env.LIBPATH) || '' }}
        run: |
          command -v ctest
          if ctest --test-dir build --output-on-failure -V; then
            exit 0
          else
            test_status=$?
          fi
          if [ "${{ matrix.platform }}" = "linux" ]; then
            echo "CTest failed; rerunning the test executable under GDB for a backtrace"
            gdb --batch \
              -ex "set pagination off" \
              -ex run \
              -ex "thread apply all bt full" \
              --args "$GITHUB_WORKSPACE/build/VirtualClub-Tests" || true
          fi
          exit "$test_status"

      # Create a separate archive of Linux ELF debug symbols for nightly builds
      - name: Package Debug Symbols (Linux)
        if: env.NIGHTLY == 'true' && matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p debug-symbols-linux
          find dist -type f -print0 | while IFS= read -r -d '' file; do
            if readelf -h "$file" >/dev/null 2>&1; then
              rel="${file#dist/}"
              out="debug-symbols-linux/${rel}.debug"
              mkdir -p "$(dirname "$out")"
              objcopy --only-keep-debug "$file" "$out"
              objcopy --strip-debug "$file"
            fi
          done
          tar -czvf debug-symbols-linux-x64.tar.gz -C debug-symbols-linux .

      # Collect PDB files produced by clang-cl for nightly builds
      - name: Package Debug Symbols (Windows)
        if: env.NIGHTLY == 'true' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $pdbFiles = Get-ChildItem -Path build -Filter *.pdb -Recurse
          if ($pdbFiles.Count -eq 0) {
            throw "No PDB debug symbols were produced"
          }
          Compress-Archive -Path $pdbFiles.FullName -DestinationPath debug-symbols-windows-x64.zip

      # Package Linux Application into a tarball (with assets folder)
      - name: Package Application (Linux)
        if: matrix.platform == 'linux'
        run: |
          tar -czvf app-linux-x64.tar.gz -C dist .

      # Package Windows Application into a zip (with assets folder)
      - name: Package Application (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath app-windows-x64.zip

      - name: Create Update Manifest
        shell: bash
        run: |
          VERSION=$(grep -E 'project\(.*VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "${{ env.NIGHTLY }}" = "true" ]; then
            MANIFEST_VERSION="nightly-${GITHUB_SHA}"
          else
            MANIFEST_VERSION="${VERSION}"
          fi
          python3 .github/scripts/create_update_manifest.py \
            --channel "${{ env.NIGHTLY == 'true' && 'nightly' || 'stable' }}" \
            --version "${MANIFEST_VERSION}" \
            --build-id "${GITHUB_SHA}" \
            --platform "${{ matrix.platform }}" \
            --minimum-version "${VERSION}" \
            --release-url "https://github.com/${{ github.repository }}/releases" \
            --linux-archive app-linux-x64.tar.gz \
            --windows-archive app-windows-x64.zip

      # Upload artifacts temporarily for the release job
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.platform }}
          path: |
            ${{ matrix.platform == 'windows' && 'app-windows-x64.zip' || 'app-linux-x64.tar.gz' }}
            update-manifest-${{ matrix.platform }}.json
            ${{ matrix.platform == 'windows' && 'app-windows-x64.zip.sha256' || 'app-linux-x64.tar.gz.sha256' }}

      - name: Upload Debug Symbols
        if: env.NIGHTLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ matrix.platform }}
          path: ${{ matrix.platform == 'windows' && 'debug-symbols-windows-x64.zip' || 'debug-symbols-linux-x64.tar.gz' }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
    
    steps:

      - name: Checkout release body file
        uses: actions/checkout@v7 
        if: env.NIGHTLY != 'true' 
        with:
          sparse-checkout: |
            .github/release_body.md
          sparse-checkout-cone-mode: false

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifact-*
          merge-multiple: true

      - name: Create Release (Nightly)
        uses: andelf/nightly-release@main
        if: env.NIGHTLY == 'true' 
        with:
          tag_name: 'nightly'
          name: Development release
          draft: false
          prerelease: true
          body: Build release for commit ${{ github.sha }}.
          files: |
            app-linux-x64.tar.gz
            app-windows-x64.zip
            debug-symbols-linux-x64.tar.gz
            debug-symbols-windows-x64.zip
            update-manifest-linux.json
            update-manifest-windows.json
            app-linux-x64.tar.gz.sha256
            app-windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (Stable)
        uses: softprops/action-gh-release@v3
        if: env.NIGHTLY != 'true' 
        with:
          tag_name: v${{ needs.build.outputs.app_version }}
          name: Release v${{ needs.build.outputs.app_version }}
          draft: false
          prerelease: false
          body_path: .github/release_body.md
          files: |
            app-linux-x64.tar.gz
            app-windows-x64.zip
            update-manifest-linux.json
            update-manifest-windows.json
            app-linux-x64.tar.gz.sha256
            app-windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

